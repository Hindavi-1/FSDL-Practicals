<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survey Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="survey.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="text-center mb-4">Feedback Survey</h2>

      <form>
        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" required />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" required />
        </div>

        <!-- Age -->
        <div class="mb-3">
          <label for="age" class="form-label">Age</label>
          <input
            type="number"
            class="form-control"
            id="age"
            min="10"
            max="100"
          />
        </div>

        <!-- Preferences Dropdown -->
        <div class="mb-3">
          <label for="preference" class="form-label">Your Preference</label>
          <select class="form-select" id="preference">
            <option selected disabled>Choose an option</option>
            <option value="design">UI Design</option>
            <option value="dev">Web Development</option>
            <option value="data">Data Science</option>
          </select>
        </div>

        <!-- Rating Radio Buttons -->
        <div class="mb-3">
          <label class="form-label">Rate Our Platform:</label><br />
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="rating"
              id="r1"
              value="1"
            />
            <label class="form-check-label" for="r1">1</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="rating"
              id="r2"
              value="2"
            />
            <label class="form-check-label" for="r2">2</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="rating"
              id="r3"
              value="3"
            />
            <label class="form-check-label" for="r3">3</label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </body>
</html>
