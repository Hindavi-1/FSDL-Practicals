<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopNow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="product.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand mb-0 h1">ShopNow</span>
      </div>
    </nav>

    <!-- Hero Section -->
    <div class="container text-center my-5">
      <h1>Welcome to ShopNow</h1>
      <p>Your one-stop shop for tech and lifestyle products</p>
      <button class="btn btn-success">Explore Now</button>
    </div>

    <!-- Products Section -->
    <div class="container">
      <h2 class="text-center mb-4">Top Picks for You</h2>
      <div class="row">
        <!-- Product 1 -->
        <div class="col-md-6 col-lg-3 mb-4 text-center">
          <img
            src="headphones.jpg"
            alt="Headphones"
            class="img-fluid"
            width="150"
          />
          <h5>Wireless Headphones</h5>
          <p>₹3,999</p>
          <button class="btn btn-outline-primary btn-sm">Buy Now</button>
        </div>

        <!-- Product 2 -->
        <div class="col-md-6 col-lg-3 mb-4 text-center">
          <img src="book.jpg" alt="Book" class="img-fluid" width="150" />
          <h5>Coding Book</h5>
          <p>₹499</p>
          <button class="btn btn-outline-primary btn-sm">Buy Now</button>
        </div>

        <!-- Product 3 -->
        <div class="col-md-6 col-lg-3 mb-4 text-center">
          <img src="watch.jpg" alt="Smartwatch" class="img-fluid" width="150" />
          <h5>Smart Watch</h5>
          <p>₹2,999</p>
          <button class="btn btn-outline-primary btn-sm">Buy Now</button>
        </div>

        <!-- Product 4 -->
        <div class="col-md-6 col-lg-3 mb-4 text-center">
          <img src="lamp.jpg" alt="Lamp" class="img-fluid" width="150" />
          <h5>LED Study Lamp</h5>
          <p>₹799</p>
          <button class="btn btn-outline-primary btn-sm">Buy Now</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-4">
      <p>&copy; 2025 ShopNow. All rights reserved.</p>
    </footer>
  </body>
</html>
