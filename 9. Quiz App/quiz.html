<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Quiz</title>
    <link rel="stylesheet" href="quiz.css" />
  </head>
  <body>
    <div class="quiz-container">
      <h1>Simple Quiz</h1>

      <div id="quiz">
        <div class="question-container">
          <h2 id="question">Question goes here</h2>
          <div class="options-container">
            <div class="option">
              <input type="radio" name="option" id="option1" value="A" />
              <label for="option1" id="option1-text">Option 1</label>
            </div>
            <div class="option">
              <input type="radio" name="option" id="option2" value="B" />
              <label for="option2" id="option2-text">Option 2</label>
            </div>
            <div class="option">
              <input type="radio" name="option" id="option3" value="C" />
              <label for="option3" id="option3-text">Option 3</label>
            </div>
            <div class="option">
              <input type="radio" name="option" id="option4" value="D" />
              <label for="option4" id="option4-text">Option 4</label>
            </div>
          </div>
        </div>

        <button id="next-btn">Next</button>
      </div>

      <div id="result" class="hide">
        <h2>Quiz Result</h2>
        <p>Your score: <span id="score">0</span> out of 5</p>
        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>

    <script src="quiz.js"></script>
  </body>
</html>
